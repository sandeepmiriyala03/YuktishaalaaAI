name: FastAPI Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Python Tests & Check
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the repository code onto the virtual machine
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python directly on the virtual machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Caches pip dependencies for faster builds

      # 3. Install your project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Run Pytest suite
      - name: Run Pytest
        run: |
          pytest --maxfail=1 --disable-warnings
